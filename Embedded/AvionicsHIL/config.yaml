isaac:
  base_url: "http://192.168.86.91:8282"   # desktop eno1 — VERIFY via `ip addr` on desktop
  poll_hz: 100

bbb:
  sensor_uart: "/dev/ttyS2"               # CONFIRMED 2026-06-23: UART2=0x48024000=ttyS2 on kernel 5.10.168-ti-r68 (NOT ttyO2 — that was older kernels)
  actuator_uart: "/dev/ttyS2"             # same port — full-duplex single link
  baud: 115200
  i2c_slave_enabled: false                # flip true only after slave support verified
  i2c_addr: 0x42

jetson:
  sensor_uart: "/dev/ttyTHS1"             # CONFIRMED 2026-06-22: pinmux CSV + check_interfaces.py
  actuator_uart: "/dev/ttyTHS1"
  baud: 115200

loop:
  rate_hz: 50

control:
  target_touchdown_velocity_mps: -1.5   # equilibrium at vz=-1.5 m/s; |vz|=1.5 < 2.0 soft-touchdown threshold
  kp: 0.0                               # altitude term off — caused equilibrium shift with kp>0
  kd: 0.05                              # tuned 2026-06-26: kd=0.30 caused oscillation/crash; 0.05 gives τ≈1.1s stable descent
