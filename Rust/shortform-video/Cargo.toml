[package]
name = "shortform-video"
version = "0.1.0"
edition = "2024"
authors = ["Ernest Yeung"]
description = "Faceless short-form video assembly: LLM script, TTS narration, stock b-roll, captioned vertical render via ffmpeg"
license = "MIT"
repository = "https://github.com/InServiceOfX/Monoclaw"

[dependencies]
ab_glyph = "0.2.32"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
msedge-tts = "0.4.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23.43", features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.5"

[[bin]]
name = "shortform-video"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
