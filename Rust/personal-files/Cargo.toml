[package]
name = "personal-files"
version = "0.1.0"
edition = "2021"
description = "A Finder-inspired Ubuntu file browser that remembers your places"
license = "MIT"

[dependencies]
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
