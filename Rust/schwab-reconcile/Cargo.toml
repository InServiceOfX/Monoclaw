[package]
name = "schwab-reconcile"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
reqwest = { version = "0.12", features = ["json", "blocking", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellexpand = "3"
urlencoding = "2"
