services:
  isaac:
    build:
      context: .
      args:
        ISAAC_VERSION: ${ISAAC_VERSION:-4.5.0}
    container_name: ${CONTAINER_NAME:-isaac-sim}
    stdin_open: true
    tty: true
    # host network required so DDS discovery sees the sibling ROS container
    # and the host-side rosa-cli. All three share ROS_DOMAIN_ID=0.
    network_mode: host
    ipc: host
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Desktop: GPU 1 = RTX 3060 12GB (GPU 0 = GTX 980 Ti, no RT cores)
              # Laptop:  GPU 0 = RTX 3070 8GB  (change GPU_ID=0 in .env)
              device_ids: ["${GPU_ID:-1}"]
              capabilities: [gpu, compute, utility, graphics]
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - DISPLAY=${DISPLAY:-:0}
      # Isaac Sim bundles its own ROS 2 Humble libs at this path.
      # Without LD_LIBRARY_PATH pointing here, librmw_cyclonedds_cpp.so is not
      # found even though RMW_IMPLEMENTATION is set, and the bridge fails with:
      #   "failed to load shared library 'librmw_cyclonedds_cpp.so'"
      # Isaac Sim tells you the fix in its own startup log — we just bake it in.
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.bridge/humble/lib
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - OMNI_USER=${OMNI_USER:-admin}
      - OMNI_PASS=${OMNI_PASS:-admin}
      # headless | windowed | streaming
      - ISAAC_MODE=${ISAAC_MODE:-headless}
      # Optional: pre-load a USD scene on startup (e.g. the Starship stage)
      # Set in .env: ISAAC_SCENE_PATH=/isaac-sim/exts/starship/starship.usd
      - ISAAC_SCENE_PATH=${ISAAC_SCENE_PATH:-}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Persist shader cache so subsequent boots don't take 5 min
      - isaac-cache:/root/.cache/ov
      - isaac-data:/root/.local/share/ov/data
      # Starship scene — edited on host, auto-picked up by Isaac
      - ./starship:/isaac-sim/exts/starship
      # Script hot-reload: mount scripts so changes take effect on restart
      # without a full docker build cycle (the image COPY is overridden by these).
      - ./scripts/enable_ros2_bridge.py:/isaac-sim/scripts/enable_ros2_bridge.py:ro
      - ./scripts/start_isaac.sh:/usr/local/bin/start_isaac.sh:ro
      - ./scripts/load_starship_hook.py:/isaac-sim/scripts/load_starship_hook.py:ro
    ports:
      # Isaac control API (rosa-isaac Rust tools) — host-networked, no mapping needed
      # but documented here for reference.
      # - "8282:8282"  (host network: port is directly available at localhost:8282)
      # Omniverse Streaming Client (ISAAC_MODE=streaming)
      - "8211:8211"
      - "8011:8011"
      - "8111:8111"

volumes:
  isaac-cache:
  isaac-data:
