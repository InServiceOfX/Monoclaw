[package]
name = "fsw_rx"
version = "0.1.0"
edition = "2021"
description = "Flight Software Telemetry Receiver — Jetson Orin Nano"

# No external dependencies — pure std only.
# Compile for Jetson: cargo build --release
# Cross-compile from x86 host:
#   rustup target add aarch64-unknown-linux-gnu
#   cargo build --release --target aarch64-unknown-linux-gnu

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
