# Example config focused on:
#   mlx-community/Qwen3.5-27B-Claude-4.6-Opus-Distilled-MLX-4bit
#
# This mirrors the 6bit template but targets 4bit quantization for devices with
# tighter memory budgets (e.g., MacBook Pro setups where 6bit may be heavier).
#
# Source notes:
# - Qwen official sampling templates: https://huggingface.co/Qwen/Qwen3.5-27B
# - Distilled upstream model: https://huggingface.co/Jackrong/Qwen3.5-27B-Claude-4.6-Opus-Reasoning-Distilled
# - Quantized behavior warnings adapted from the mlx-community 6bit card:
#   keep max_tokens >= 4096 and use repetition_penalty around 1.15

paths:
  venv_bin: /Users/ernestyeung/Prop/openclaw/.venv/bin
  model_path: /Users/ernestyeung/.cache/huggingface/hub/models--mlx-community--Qwen3.5-27B-Claude-4.6-Opus-Distilled-MLX-4bit

chat:
  max_kv_size: 32768
  default_system_prompt: "You are a helpful, thoughtful assistant. Think step by step before answering."

serve:
  host: 127.0.0.1
  port: 8080
  log_level: INFO
  decode_concurrency: 1
  prompt_concurrency: 1

modes:
  thinking_general:
    enable_thinking: true
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.15
    max_tokens: 8192
    system_prompt: "You are a helpful, thoughtful assistant. Think step by step before answering."

  thinking_coding:
    enable_thinking: true
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.15
    max_tokens: 8192
    system_prompt: "You are an expert programmer. Be precise and correct."

  instruct_general:
    enable_thinking: false
    temperature: 0.7
    top_p: 0.8
    top_k: 20
    min_p: 0.05
    presence_penalty: 1.5
    repetition_penalty: 1.15
    max_tokens: 4096
    system_prompt: "You are a helpful assistant."

  instruct_reasoning:
    enable_thinking: false
    temperature: 1.0
    top_p: 1.0
    top_k: 40
    min_p: 0.0
    presence_penalty: 2.0
    repetition_penalty: 1.15
    max_tokens: 4096
    system_prompt: "You are a careful reasoning assistant."
